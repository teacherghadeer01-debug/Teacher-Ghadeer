/* Layout: one hub. Language switch + subject chooser, then the chosen subject's game board.
   Sources sit in a small collapsible section; the author's name closes the page on a soft shaded band. */
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --ink:#24204A; --muted:#5E5980; --line:#DCD8EA;
  --accent:#5B3FA6; --accent-ink:#FFFFFF; --tint:#EEE9FA; --sun:#F2A93B; --good:#2E7D4F; --bad:#B83B30; --band:#ECE8F4;
  --display:"Noor Display",Georgia,"Times New Roman",serif;
  --body:"Noor Body",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --arabic:"Noor Arabic","Geeza Pro","Traditional Arabic",serif;
  --naskh:"Noor Naskh","Noor Arabic","Geeza Pro",Tahoma,serif;
  --name:"Noor Name","Noor Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132A;--surface:#1F1C3A;--ink:#EEEAFB;--muted:#ABA4CF;--line:#38335C;--accent-ink:#15132A;--tint:#2A2650;--good:#5CC48A;--bad:#EE7468;--band:#26224A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15132A;--surface:#1F1C3A;--ink:#EEEAFB;--muted:#ABA4CF;--line:#38335C;--accent-ink:#15132A;--tint:#2A2650;--good:#5CC48A;--bad:#EE7468;--band:#26224A;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;padding-inline:16px;padding-block:20px 0;overflow-x:hidden}
html[lang="ar"] body{font-family:var(--naskh);font-size:19px;line-height:1.75}
.wrap{max-width:940px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.eyebrow{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
html[lang="ar"] .eyebrow{font-family:var(--naskh);letter-spacing:0;font-size:15px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,50px);margin:2px 0 0;line-height:1.15;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2{font-family:var(--naskh);font-weight:700}
.sub{margin:6px 0 0;color:var(--muted);max-width:60ch}
.lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:700 15px var(--body);padding:8px 14px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation}
.lang button[lang="ar"]{font-family:var(--naskh);font-size:16px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* chooser */
.chooser h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.6vw,28px);margin:0 0 10px}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:6px;text-align:start;padding:18px;border-radius:18px;border:2px solid transparent;background:var(--s-tint);color:var(--ink);cursor:pointer;font:inherit;min-width:0;touch-action:manipulation}
.subj:hover{border-color:var(--s-accent)}
.subj b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;color:var(--ink)}
html[lang="ar"] .subj b{font-family:var(--naskh);font-weight:700}
.subj span{color:var(--muted);font-size:16px}
.subj i{font-style:normal;align-self:flex-start;margin-top:4px;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--s-accent);padding:4px 12px;border-radius:999px}
html[lang="ar"] .subj i{font-family:var(--naskh);letter-spacing:0;font-size:14px}
/* subject view */

", "o": ["ب", "م", "ن", "و"]}, {"q": "How many letters are there for Ikhfa (hiding)?", "a": "15", "o": ["15", "6", "4", "1"]}, {"q": "What does a sukoon (small circle) on a letter mean?", "a": "The letter has no vowel", "o": ["The letter has no vowel", "Stretch the letter", "Double the letter", "Stop reading"]}, {"q": "What does a shaddah on a letter mean?", "a": "The letter is doubled", "o": ["The letter is doubled", "The letter is silent", "Read it quietly", "Stretch for 6 counts"]}, {"q": "The word “Tajweed” comes from a root meaning…", "a": "to make excellent", "o": ["to make excellent", "to read fast", "to memorise", "to write"]}]}, {"id": "detective", "type": "single", "name": "Tajweed Detective", "hint": "Look at the big letter or word. Which Tajweed rule or group does it belong to?", "items": [{"l": "ق", "a": "Qalqalah", "w": "ق ط ب ج د bounce when they have a sukoon.", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "ط", "a": "Qalqalah", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "ج", "a": "Qalqalah", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "نّ", "a": "Ghunnah", "w": "Noon or Meem with a shaddah: hold the nasal sound for 2 counts.", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "مّ", "a": "Ghunnah", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "ع", "a": "Throat letter (Izhar)", "w": "After a Noon Sakinah, a throat letter is read clearly.", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "خ", "a": "Throat letter (Izhar)", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "ه", "a": "Throat letter (Izhar)", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "قَالَ", "a": "Madd", "w": "A fatha before an alif stretches for 2 counts.", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}, {"l": "يَقُولُ", "a": "Madd", "o": ["Qalqalah", "Ghunnah", "Throat letter (Izhar)", "Madd"]}]}], "sources": [["The Noble Qur'an, Mushaf al-Madinah (Hafs narration)", "King Fahd Glorious Qur'an Printing Complex", "qurancomplex.gov.sa"], ["The Qur'an with English translation (Saheeh International)", "Quran.com", "quran.com"], ["Tuhfat al-Atfal wal-Ghilman (Noon Sakinah, Tanween and Madd rules)", "Sulayman al-Jamzuri", ""], ["Al-Muqaddimah al-Jazariyyah (makharij and Qalqalah letters)", "Imam Ibn al-Jazari", ""], ["Sahih al-Bukhari 5027: the best of you learn the Qur'an and teach it", "Sunnah.com", "sunnah.com/bukhari:5027"]]}, "hadith": {"name": "Hadith", "sub": "Short, authentic hadith turned into games that get students talking about living the Sunnah.", "games": [{"id": "spin", "type": "wheel", "name": "Spin & Share", "hint": "Spin the wheel, answer the question, then pass the turn to someone new. Perfect for the first ten minutes.", "prompts": {"My Sunnah": ["Which Sunnah is easiest for you to practise daily?", "Which Sunnah would you like to start this week?", "What do you say before you eat?", "Share a du'a from the Sunnah you say every day."], "Manners": ["Smiling is charity. Who will you smile at today?", "Which good manner of the Prophet ﷺ do you most admire?", "How can we stay calm when we feel angry?", "Share a kind word someone said to you this week."], "Hadith I Know": ["Share a hadith you try to live by.", "Say the first hadith you ever learned.", "Who taught you your first hadith?", "Which hadith would you teach a child?"], "Reflect": ["“Make things easy.” Where can you make life easier for someone?", "What is one good deed you can do in 1 minute?", "How do you remember to make a good intention?", "Who is a role model of good character for you?"]}, "colors": ["#C27B12", "#E2665A", "#5B3FA6", "#1F8A77"]}, {"id": "quiz", "type": "quiz", "name": "Team Quiz Show", "hint": "Split the class into Team Crescent and Team Star. Teams take turns; tap the answer the team chooses.", "items": [{"q": "“The best of you are those who learn the Qur'an and…”", "a": "teach it", "o": ["teach it", "recite it daily", "write it", "carry it"], "w": "Sahih al-Bukhari 5027."}, {"q": "“The reward of deeds depends upon the…”", "a": "intentions", "o": ["intentions", "results", "words", "effort"], "w": "Sahih al-Bukhari 1."}, {"q": "“None of you will have faith till he wishes for his brother what…”", "a": "he likes for himself", "o": ["he likes for himself", "his parents like", "the people like", "is easy for him"], "w": "Sahih al-Bukhari 13."}, {"q": "A man asked for advice again and again. The Prophet ﷺ kept saying: “Do not…”", "a": "become angry", "o": ["become angry", "sleep late", "eat too much", "speak loudly"], "w": "Sahih al-Bukhari 6116."}, {"q": "“The strong is the one who controls himself while in…”", "a": "anger", "o": ["anger", "hunger", "sadness", "fear"], "w": "Sahih al-Bukhari 6114."}, {"q": "“Facilitate things to people and do not make it…”", "a": "hard for them", "o": ["hard for them", "long for them", "quiet for them", "late for them"], "w": "Sahih al-Bukhari 69."}, {"q": "According to the hadith, saying a good word is…", "a": "charity (sadaqah)", "o": ["charity (sadaqah)", "a duty", "a pillar", "a secret"], "w": "Sahih al-Bukhari 2989."}, {"q": "According to the hadith, smiling in your brother's face is…", "a": "charity (sadaqah)", "o": ["charity (sadaqah)", "rude", "a pillar", "a vow"], "w": "Jami' at-Tirmidhi 1956."}]}, {"id": "charity", "type": "pickall", "name": "Charity Hunt", "hint": "The Prophet ﷺ taught that many small deeds count as charity. Tap every deed he called charity.", "items": [["Smiling in your sister's face", true, "Tirmidhi 1956"], ["Saying a good word", true, "Bukhari 2989"], ["Removing something harmful from the road", true, "Bukhari 2989"], ["Every step you walk to the prayer", true, "Bukhari 2989"], ["Helping someone onto their ride", true, "Bukhari 2989"], ["Guiding someone who is lost", true, "Tirmidhi 1956"], ["Pouring water from your bucket into your sister's", true, "Tirmidhi 1956"], ["Showing off how much you gave", false], ["Making fun of a classmate", false], ["Wasting food", false]]}], "sources": [["Sahih al-Bukhari 1: actions and intentions", "Sunnah.com", "sunnah.com/bukhari:1"], ["Sahih al-Bukhari 13: wish for your brother what you like for yourself", "Sunnah.com", "sunnah.com/bukhari:13"], ["Sahih al-Bukhari 69: make things easy", "Sunnah.com", "sunnah.com/bukhari:69"], ["Sahih al-Bukhari 2989 and Sahih Muslim 1009: a good word is charity", "Sunnah.com", "sunnah.com/bukhari:2989"], ["Sahih al-Bukhari 5027: learn the Qur'an and teach it", "Sunnah.com", "sunnah.com/bukhari:5027"], ["Sahih al-Bukhari 6114: the strong one controls himself in anger", "Sunnah.com", "sunnah.com/bukhari:6114"], ["Sahih al-Bukhari 6116: do not become angry", "Sunnah.com", "sunnah.com/bukhari:6116"], ["Jami' at-Tirmidhi 1956 (hasan): smiling is charity", "Sunnah.com", "sunnah.com/tirmidhi:1956"], ["Arabic texts and grading cross-checked", "Ad-Durar as-Saniyyah hadith encyclopedia", "dorar.net"]]}, "fiqh": {"name": "Fiqh", "sub": "Games about the pillars, prayer and wudu that turn first-lesson nerves into confident answers.", "games": [{"id": "spin", "type": "wheel", "name": "Spin & Share", "hint": "Spin the wheel, answer the question, then pass the turn to someone new. Perfect for the first ten minutes.", "prompts": {"Prayer": ["Which prayer do you find hardest to wake up for?", "Where is the most beautiful place you have prayed?", "How do you remember to pray on time when you are busy?", "Which du'a do you love to say in sujood?"], "Wudu": ["Say the steps of wudu in order, as fast as you can!", "What do you say after finishing wudu?", "Teach the class one step of wudu with actions.", "Why do you think wudu washes away small sins?"], "Pillars": ["Name the five pillars of Islam.", "Which pillar are you most excited to learn about?", "Share a Ramadan memory.", "If you have been to Hajj or Umrah, tell us one moment."], "Questions": ["Share a fiqh question you have always wanted to ask.", "What is one ruling you learned recently?", "Who do you ask when you have a fiqh question?", "What makes worship feel easier for you?"]}, "colors": ["#2F6DB5", "#1F8A77", "#C27B12", "#5B3FA6"]}, {"id": "quiz", "type": "quiz", "name": "Team Quiz Show", "hint": "Split the class into Team Crescent and Team Star. Teams take turns; tap the answer the team chooses.", "items": [{"c": "Fact or fiction?", "q": "There are five obligatory prayers every day.", "a": "True", "o": ["True", "False"], "w": "Sahih al-Bukhari 8."}, {"c": "Fact or fiction?", "q": "Maghrib has four obligatory rak'ahs.", "a": "False", "o": ["True", "False"], "w": "Maghrib has three."}, {"c": "Fact or fiction?", "q": "Wiping the head is part of wudu.", "a": "True", "o": ["True", "False"], "w": "Al-Ma'idah 5:6."}, {"c": "Fact or fiction?", "q": "Wudu begins by washing the feet.", "a": "False", "o": ["True", "False"], "w": "The feet are washed last (Al-Ma'idah 5:6)."}, {"c": "Fact or fiction?", "q": "Zakat is one of the five pillars of Islam.", "a": "True", "o": ["True", "False"], "w": "Sahih al-Bukhari 8."}, {"c": "Fact or fiction?", "q": "Fajr has two obligatory rak'ahs.", "a": "True", "o": ["True", "False"]}, {"c": "Fact or fiction?", "q": "The fasting month is Sha'ban.", "a": "False", "o": ["True", "False"], "w": "The fasting month is Ramadan (Al-Baqarah 2:185)."}, {"c": "Fact or fiction?", "q": "The Qibla is the Ka'bah in Makkah.", "a": "True", "o": ["True", "False"], "w": "Al-Baqarah 2:144."}, {"c": "Fact or fiction?", "q": "All the obligatory rak'ahs in one day add up to 17.", "a": "True", "o": ["True", "False"], "w": "2 + 4 + 4 + 3 + 4 = 17."}, {"c": "Fact or fiction?", "q": "Hajj is obligatory every year for every Muslim.", "a": "False", "o": ["True", "False"], "w": "Once in a lifetime, for those who are able (Al-Imran 3:97)."}]}, {"id": "wudu", "type": "order", "name": "Wudu in Order", "hint": "Tap the steps of wudu in the right order, from first to last.", "done": "Wudu complete! «Indeed, Allah loves those who purify themselves.» Al-Baqarah 2:222", "items": [["Intention and Bismillah", "Step 1"], ["Wash both hands", "Step 2"], ["Rinse the mouth and nose", "Step 3"], ["Wash the face", "Step 4"], ["Wash the arms up to the elbows", "Step 5"], ["Wipe the head and ears", "Step 6"], ["Wash the feet up to the ankles", "Step 7"]]}], "sources": [["The Noble Qur'an, Mushaf al-Madinah (Hafs narration)", "King Fahd Glorious Qur'an Printing Complex", "qurancomplex.gov.sa"], ["The Qur'an with English translation (Saheeh International)", "Quran.com", "quran.com"], ["Sahih al-Bukhari 8 and Sahih Muslim 16: Islam is built upon five", "Sunnah.com", "sunnah.com/bukhari:8"], ["Sahih al-Bukhari 159: Uthman's description of the Prophet's wudu", "Sunnah.com", "sunnah.com/bukhari:159"], ["Sahih Muslim 244: sins leave with the water of wudu", "Sunnah.com", "sunnah.com/muslim:244"], ["Ayat used: 2:144 (Qibla), 2:185 (Ramadan), 2:222, 3:97 (Hajj), 5:6 (wudu)", "Mushaf al-Madinah", "quran.com"], ["Al-Fiqh al-Muyassar fi Daw' al-Kitab was-Sunnah", "King Fahd Glorious Qur'an Printing Complex", "qurancomplex.gov.sa"]]}, "seerah": {"name": "Seerah", "sub": "Meet the Prophet ﷺ and the great women around him through timelines, riddles and stories.", "games": [{"id": "spin", "type": "wheel", "name": "Spin & Share", "hint": "Spin the wheel, answer the question, then pass the turn to someone new. Perfect for the first ten minutes.", "prompts": {"Events": ["Which event in the Seerah inspires you most?", "Tell us one thing about the Hijrah.", "What happened in Cave Hira?", "What do you know about the Conquest of Makkah?"], "Sahabiyyat": ["If you could ask a Sahabiyyah one question, who and what?", "What do you know about Khadijah (may Allah be pleased with her)?", "Which Sahabiyyah would you name your daughter after?", "Who was Asma bint Abi Bakr?"], "Character": ["Which quality of the Prophet ﷺ do you want to grow in?", "Share a story of the Prophet's ﷺ kindness   const b=board(g,area);const list=document.createElement("div");list.className="events";const fb=document.createElement("p");fb.className="fb";fb.setAttribute("aria-live","polite");b.append(list,fb);let n=0;
  shuffle(g.items).forEach(([t,d])=>{const e=document.createElement("button");e.type="button";e.className="ev";e.innerHTML=`<span class="n">?</span><span>${fmt(t)}<small>${U().tapnext}</small></span>`;
   e.onclick=()=>{if(e.classList.contains("placed"))return;if(g.items[n][0]===t){n++;e.classList.add("placed");e.querySelector(".n").textContent=n;e.querySelector("small").innerHTML=fmt(d);fb.className="fb ok";fb.innerHTML=n===g.items.length?fmt(g.done):cheer()}else{e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");fb.className="fb no";fb.textContent=U().notyet}};list.append(e)});
  const r=document.createElement("button");r.type="button";r.className="btn ghost";r.textContent=U().again;r.style.alignSelf="flex-start";r.onclick=()=>openGame(g.id);b.append(r);
 },
 pickall(g,area){
  const b=board(g,area);const grid=document.createElement("div");grid.className="picks";const fb=document.createElement("p");fb.className="fb";fb.setAttribute("aria-live","polite");b.append(grid,fb);
  const need=g.items.filter(x=>x[1]).length;let got=0;
  shuffle(g.items).forEach(([t,ok,ref])=>{const c=document.createElement("button");c.type="button";c.className="pick";c.innerHTML=fmt(t);
   c.onclick=()=>{if(c.dataset.done)return;c.dataset.done=1;if(ok){got++;c.classList.add("yes");c.innerHTML=fmt(t)+(ref?`<br><span class="ref">${esc(ref)}</span>`:"");fb.className="fb ok";fb.textContent=got===need?U().allfound:`${cheer()} ${U().more.replace("{n}",need-got)}`}else{c.classList.add("no");fb.className="fb no";fb.textContent=U().notlist}};grid.append(c)});
  const r=document.createElement("button");r.type="button";r.className="btn ghost";r.textContent=U().again;r.style.alignSelf="flex-start";r.onclick=()=>openGame(g.id);b.append(r);
 }
};
function runner(g,area,teamMode){
 const b=board(g,area);let items=shuffle(g.items),i=0,score=0,turn=0,teams=[0,0];const u=U();
 const top=document.createElement("div");top.style.cssText="display:flex;flex-direction:column;gap:12px";const ar=document.createElement("div");ar.style.cssText="display:flex;flex-direction:column;gap:14px";b.append(top,ar);
 const drawTop=()=>{top.innerHTML=(teamMode?`<div class="teams"><div class="team ${turn==0?"on":""}"><span>${u.teams[0]}</span><b>${teams[0]}</b></div><div class="team ${turn==1?"on":""}"><span>${u.teams[1]}</span><b>${teams[1]}</b></div></div>`:"")+`<div class="bar"><i style="width:${i/items.length*100}%"></i></div>`};
 function next(){drawTop();ar.innerHTML="";
  if(i>=items.length){const msg=teamMode?(teams[0]==teams[1]?u.tie:(teams[0]>teams[1]?u.win0:u.win1)):u.score.replace("{s}",score).replace("{n}",items.length);
   ar.innerHTML=`<div class="win">${msg}<span>${teamMode?u.afterTeam:u.afterSolo}</span></div>`;const r=document.createElement("button");r.type="button";r.className="btn";r.textContent=u.playagain;r.style.alignSelf="center";r.onclick=()=>{i=0;score=0;turn=0;teams=[0,0];items=shuffle(items);next()};ar.append(r);return}
  const it=items[i];const head=document.createElement("div");
  head.innerHTML=it.l?`<div class="letter">${it.l}</div>`:`${it.c?`<span class="chip">${esc(it.c)}</span>`:""}<p class="q" style="margin-top:10px">${fmt(it.q)}</p>`;ar.append(head);
  const ch=document.createElement("div");ch.className="choices";const fb=document.createElement("p");fb.className="fb";fb.setAttribute("aria-live","polite");
  const labels=LANG==="ar"?"أبجد":"ABCD";
  (it.o.length===2?it.o:shuffle(it.o)).forEach((o,k)=>{const c=document.createElement("button");c.type="button";c.className="choice";c.innerHTML=`<i>${labels[k]}</i><span>${fmt(o)}</span>`;c.dataset.v=o;
   c.onclick=()=>{if(ch.dataset.done)return;ch.dataset.done=1;const ok=o===it.a;
    if(ok){c.classList.add("right");score++;if(teamMode)teams[turn]++;fb.className="fb ok";fb.innerHTML=cheer()+(it.w?" "+fmt(it.w):"")}
    else{c.classList.add("wrong");[...ch.children].find(x=>x.dataset.v===it.a).classList.add("right");fb.className="fb no";fb.innerHTML=u.answer+" "+fmt(it.a)+(it.w?(LANG==="ar"?"، ":". ")+fmt(it.w):"")}
    drawTop();const nx=document.createElement("button");nx.type="button";nx.className="btn";nx.textContent=i+1<items.length?u.next:u.results;nx.style.alignSelf="flex-start";nx.onclick=()=>{i++;if(teamMode)turn=1-turn;next()};ar.append(nx);nx.focus({preventScroll:true})};ch.append(c)});
  ar.append(ch,fb)}
 next();
}
function renderSources(){const u=U(),el=$("#sources");
  let h=`<summary>${u.sources}</summary><p class="note">${u.sourcesNote}</p>`;
  ORDER.forEach(k=>{const d=DATA[LANG].subjects[k];h+=`<h3>${fmt(d.name)}</h3><ol>`+d.sources.map(([t,w,l])=>`<li>${fmt(esc(t))}${w?` · ${esc(w)}`:""}${l?` · <a href="https://${l}" target="_blank" rel="noopener">${esc(l)}</a>`:""}</li>`).join("")+"</ol>"});
  el.innerHTML=h}
function setLang(l){const s=SUBJ,g=GAME;LANG=l;applyLang();if(s)openSubject(s,g);else home()}
$("#btn-en").onclick=()=>setLang("en");$("#btn-ar").onclick=()=>setLang("ar");
(function boot(){const h=(location.hash||"").slice(1).split("-");
  LANG=h[0]==="ar"||h[0]==="en"?h[0]:((navigator.language||"").startsWith("ar")?"ar":"en");applyLang();
  if(ORDER.includes(h[1]))openSubject(h[1],h[2]);else home()})();
</script>
